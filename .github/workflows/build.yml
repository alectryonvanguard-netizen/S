name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev \
            cmake unzip zip git

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Check files
        run: |
          test -f buildozer.spec
          test -f main.py 

      - name: Clean old build state
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer/android/platform/python-for-android

      - name: Get pinned python-for-android
        run: |
          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git "$HOME/p4a"
          sed -i '/^p4a\./d' buildozer.spec
          sed -i "/^\[app\]/a p4a.source_dir = $HOME/p4a" buildozer.spec

      - name: Show spec
        run: cat buildozer.spec

      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStore-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: .buildozer/logs/
          if-no-files-found: ignore
