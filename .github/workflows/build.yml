name: Build APK

on:
  workflow_dispatch:      # gives you a "Run workflow" button on your phone
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y automake autoconf libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev unzip zip git

      - name: Install buildozer
        run: pip install buildozer "cython<3"

      - name: Build debug APK
        env:
          PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: MyStore-apk
          path: bin/*.apk
